<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>FFXIV Job Wheel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Job Wheel</h1>
    <p class="sub">Let fate choose your next job</p>
  </header>

  <main>
    <section class="wheel-area">
      <div class="wheel-wrap" id="wheelWrap">
        <div class="pointer" id="pointer" aria-hidden="true">
          <!-- Victorian brass pointer: beaded boss, scrollwork, collar and spearhead -->
          <svg viewBox="0 0 64 104">
            <defs>
              <linearGradient id="ptrBevel" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#fff7e2"/>
                <stop offset="0.4" stop-color="#d6bf86"/>
                <stop offset="0.55" stop-color="#a8874a"/>
                <stop offset="1" stop-color="#5e4520"/>
              </linearGradient>
              <radialGradient id="ptrDome" cx="0.35" cy="0.3" r="0.8">
                <stop offset="0" stop-color="#fff7e2"/>
                <stop offset="0.4" stop-color="#d6bf86"/>
                <stop offset="0.8" stop-color="#8a6a35"/>
                <stop offset="1" stop-color="#4a3416"/>
              </radialGradient>
            </defs>
            <g fill="none" stroke-linecap="round">
              <g id="ptrScroll">
                <path d="M22 24 C12 29 3 23 5 14 C6 8 14 7 14.5 12.5 C15 16 11 17 10 14.5" stroke="#2e1f0a" stroke-width="5.5"/>
                <path d="M22 24 C12 29 3 23 5 14 C6 8 14 7 14.5 12.5 C15 16 11 17 10 14.5" stroke="url(#ptrDome)" stroke-width="3"/>
              </g>
              <use href="#ptrScroll" transform="translate(64 0) scale(-1 1)"/>
            </g>
            <path d="M32 36 C41 42 47 52 42.5 63 L32 101 L21.5 63 C17 52 23 42 32 36 Z" fill="url(#ptrBevel)" stroke="#2e1f0a" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M32 39 L32 97" stroke="rgba(255, 247, 226, 0.75)" stroke-width="1"/>
            <path d="M33.2 40 L33.2 94" stroke="rgba(46, 31, 10, 0.45)" stroke-width="1"/>
            <circle cx="32" cy="53" r="3.2" fill="#2e1f0a"/>
            <circle cx="31.2" cy="52.2" r="1.3" fill="#d6bf86"/>
            <rect x="21" y="27" width="22" height="5" rx="2" fill="url(#ptrBevel)" stroke="#2e1f0a" stroke-width="1.2"/>
            <rect x="24" y="31.5" width="16" height="5" rx="2" fill="url(#ptrBevel)" stroke="#2e1f0a" stroke-width="1.2"/>
            <circle cx="32" cy="16" r="13" fill="url(#ptrDome)" stroke="#2e1f0a" stroke-width="1.5"/>
            <g fill="#fff3d0" stroke="#5e4520" stroke-width="0.5">
              <circle cx="42.50" cy="16.00" r="1.1"/><circle cx="41.09" cy="21.25" r="1.1"/><circle cx="37.25" cy="25.09" r="1.1"/>
              <circle cx="32.00" cy="26.50" r="1.1"/><circle cx="26.75" cy="25.09" r="1.1"/><circle cx="22.91" cy="21.25" r="1.1"/>
              <circle cx="21.50" cy="16.00" r="1.1"/><circle cx="22.91" cy="10.75" r="1.1"/><circle cx="26.75" cy="6.91" r="1.1"/>
              <circle cx="32.00" cy="5.50" r="1.1"/><circle cx="37.25" cy="6.91" r="1.1"/><circle cx="41.09" cy="10.75" r="1.1"/>
            </g>
            <circle cx="32" cy="16" r="7.5" fill="none" stroke="rgba(46, 31, 10, 0.55)" stroke-width="1"/>
            <circle cx="32" cy="16" r="4.5" fill="url(#ptrDome)" stroke="#2e1f0a" stroke-width="1"/>
            <circle cx="30.6" cy="14.6" r="1.4" fill="rgba(255, 255, 255, 0.85)"/>
          </svg>
        </div>
        <canvas id="wheel" aria-label="Job wheel"></canvas>
        <button class="hub" id="spinBtn" title="Spin (Space)">SPIN</button>
      </div>
      <p class="hint">Click the hub or press <kbd>Space</kbd> to spin</p>
    </section>

    <aside class="panel">
      <div class="card result" id="result">
        <div class="result-empty">Spin the wheel to choose a job</div>
      </div>

      <div class="card">
        <h2>Filter</h2>
        <div class="quick">
          <button class="chip" data-quick="all">All Jobs</button>
          <button class="chip" data-quick="dps">All DPS</button>
        </div>
        <div class="roles" id="roleFilters"></div>
        <label class="toggle">
          <input type="checkbox" id="includeLimited" checked>
          <span>Include limited jobs (Blue Mage, Beastmaster)</span>
        </label>
        <p class="count" id="count"></p>
      </div>

      <div class="card history-card">
        <div class="row">
          <h2>History</h2>
          <button class="link" id="clearHistory">Clear</button>
        </div>
        <ol class="history" id="history"></ol>
      </div>

      <div class="card options">
        <label class="toggle">
          <input type="checkbox" id="sound" checked>
          <span>Sound</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="noRepeat">
          <span>Don't repeat last result</span>
        </label>
      </div>
    </aside>
  </main>

  <script src="jobs.js"></script>
  <script src="app.js"></script>
</body>
</html>
